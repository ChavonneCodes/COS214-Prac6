name: Set up GoogleTest 1.11
description: >
  Builds GoogleTest 1.11 (the last release that supports C++11, which the project uses).
  Ubuntu 24.04's packaged version is 1.14 and needs C++14.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make
        git clone --depth 1 --branch release-1.11.0 https://github.com/google/googletest.git /tmp/googletest
        cmake -S /tmp/googletest -B /tmp/googletest/build \
          -DCMAKE_CXX_STANDARD=11 -DBUILD_GMOCK=OFF -DCMAKE_INSTALL_PREFIX=/opt/gtest
        sudo cmake --build /tmp/googletest/build --target install -j"$(nproc)"
