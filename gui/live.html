<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIVIDY Live Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --ink:#10201c; --ink2:#1a2f29; --body:#43544f; --soft:#74857f; --line:#e3e0d8; --paper:#f7f5f0; --card:#fff;
  --lime:#c6f06a; --only:#e8590c; --only-bg:#fff0e6; --done:#16894f; --done-bg:#def4e7; --live:#2467d6; --live-bg:#e3edfc;
  --bad:#d02f45; --bad-bg:#fde6e9; --idle:#7b8a85; --idle-bg:#eef0ee; --wait:#8a6a00; --wait-bg:#fbf3d6;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,Consolas,monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--paper); color:var(--body); font-family:var(--font); font-size:14px; line-height:1.5; }
button, select, input { font:inherit; color:inherit; }
button { cursor:pointer; border:0; background:none; }
header { background:var(--ink); position:sticky; top:0; z-index:10; }
.top { max-width:1320px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:18px; }
.logo { color:#fff; font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; text-decoration:none; }
.logo i { width:12px; height:12px; border-radius:4px; background:var(--lime); }
.tag { color:#a9bdb6; font-size:13px; }
.top a.link { color:#d6e2de; font-size:13px; font-weight:600; text-decoration:none; margin-left:auto; }
.top a.link:hover { color:#fff; }
.ghost { color:#fff; border:1px solid #47605a; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; }
.ghost:hover { background:var(--ink2); }
main { max-width:1320px; margin:0 auto; padding:20px; display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; align-items:start; }
aside, .stack { display:flex; flex-direction:column; gap:14px; min-width:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; }
h2 { color:var(--ink); font-size:14px; font-weight:800; margin-bottom:8px; }
.hint { color:var(--soft); font-size:12px; }
label { display:block; font-size:12px; font-weight:600; color:var(--soft); margin:8px 0 3px; }
select, input { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:#fff; }
.primary { background:var(--ink); color:#fff; font-weight:700; border-radius:8px; padding:9px 12px; width:100%; margin-top:12px; }
.primary:hover { background:var(--ink2); }
.row { display:flex; align-items:center; gap:8px; width:100%; padding:7px 8px; border-radius:8px; text-align:left; }
.row:hover { background:var(--paper); }
.row.on { background:var(--live-bg); }
.grow { flex:1; min-width:0; overflow-wrap:anywhere; }
.name { color:var(--ink); font-weight:600; }
.sub { color:var(--soft); font-size:12px; }
.pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; background:var(--idle-bg); color:var(--idle); }
.pill.Completed, .pill.COMPLETED { background:var(--done-bg); color:var(--done); }
.pill.In_Progress, .pill.RUNNING, .pill.Assigned { background:var(--live-bg); color:var(--live); }
.pill.Available { background:var(--wait-bg); color:var(--wait); }
.pill.Rejected, .pill.Failed, .pill.Cancelled, .pill.CANCELLED { background:var(--bad-bg); color:var(--bad); }
.pill.Escalated { background:var(--only-bg); color:var(--only); }
.head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.head h1 { color:var(--ink); font-size:20px; font-weight:800; }
.bar { height:8px; background:var(--idle-bg); border-radius:99px; overflow:hidden; margin-top:10px; }
.bar i { display:block; height:100%; background:var(--done); transition:width .25s; }
.spacer { margin-left:auto; }
.btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; font-weight:600; color:var(--ink); font-size:13px; }
.btn:hover { border-color:var(--ink); }
.btn:disabled { opacity:.4; cursor:not-allowed; border-color:var(--line); }
.btn.warn { color:var(--bad); }
.two { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:14px; }
.node { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:8px; width:100%; text-align:left; }
button.node:hover { background:var(--paper); }
.node.current { box-shadow:inset 3px 0 0 var(--live); }
.node.on { background:var(--live-bg); }
.node.stage { color:var(--ink); font-weight:800; font-size:13px; }
.node.waiting .name { color:var(--soft); font-weight:500; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--live); flex:none; }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.inline { display:flex; gap:6px; flex:1 1 220px; min-width:0; }
.inline select { flex:1; min-width:0; }
.edge { display:flex; align-items:center; gap:6px; padding:3px 0; font-size:13px; color:var(--soft); flex-wrap:wrap; }
.edge.taken { color:var(--ink); font-weight:600; }
.edge .lbl { font-size:11px; background:var(--idle-bg); padding:1px 6px; border-radius:6px; }
.edge.taken .lbl { background:var(--done-bg); color:var(--done); }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:10px; flex-wrap:wrap; }
.tabs button { padding:7px 10px; font-weight:700; color:var(--soft); border-bottom:2px solid transparent; font-size:13px; }
.tabs button.on { color:var(--ink); border-color:var(--ink); }
.log { max-height:320px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
.line { border-left:3px solid var(--idle-bg); padding:2px 0 2px 9px; overflow-wrap:anywhere; }
.line.action { border-color:var(--live); } .line.refused { border-color:var(--bad); } .line.route { border-color:var(--done); }
.line.undo { border-color:var(--only); } .line.approval { border-color:var(--wait); }
.line.refused .text { color:var(--bad); font-weight:600; }
.pat { color:var(--soft); font-size:11px; font-weight:600; }
.mono { font-family:var(--mono); font-size:12px; }
.empty { color:var(--soft); padding:6px 0; }
#notice { display:none; background:var(--bad-bg); color:var(--bad); font-weight:600; border-radius:10px; padding:9px 12px; grid-column:1/-1; }
#welcome { padding:34px; text-align:center; }
@media (max-width:980px) { main { grid-template-columns:minmax(0,1fr); } .two { grid-template-columns:minmax(0,1fr); } .tag { display:none; } }
</style>
</head>
<body>
<header><div class="top">
  <a class="logo" href="/"><i></i>TIVIDY</a>
  <span class="tag">Live console: every action runs on the real engine</span>
  <a class="link" href="/replay">Recorded run</a>
  <button class="ghost" id="reset">Start over</button>
</div></header>

<main>
  <div id="notice"></div>
  <aside>
    <div class="card">
      <h2>Start a case</h2>
      <label for="process">Process</label><select id="process"></select>
      <label for="version">Version</label><select id="version"></select>
      <div id="budgetBox"><label for="budget">Budget (rand)</label><input id="budget" type="number" min="0" value="750000"></div>
      <label for="rule">Who gets the work</label><select id="rule"></select>
      <button class="primary" id="start">Start case</button>
    </div>
    <div class="card"><h2>Cases</h2><div id="cases"></div></div>
    <div class="card"><h2>Available work</h2><div id="work"></div></div>
    <div class="card"><h2>People</h2><div id="people"></div></div>
  </aside>
  <div class="stack" id="detail"></div>
</main>

<script>
var data = null, focus = '', picked = null, tab = 'feed';
var $ = function (id) { return document.getElementById(id); };
var esc = function (text) {
  return String(text).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
};
var pill = function (state) { return state ? '<span class="pill ' + esc(state) + '">' + esc(state.replace('_', ' ')) + '</span>' : ''; };

function call(path, params) {
  var query = new URLSearchParams(params || {}).toString();
  return fetch(path + '?' + query).then(function (response) {
    return response.json().then(function (body) {
      if (body.error) throw new Error(body.error);
      return body;
    });
  }).then(function (body) {
    $('notice').style.display = 'none';
    data = body;
    if (body.focus) focus = body.focus;
    render();
  }).catch(function (error) {
    var offline = error instanceof TypeError;
    $('notice').textContent = offline ? 'The console is not responding. Run "make live" in the repo folder, then refresh.' : error.message;
    $('notice').style.display = 'block';
  });
}

function act(caseId, item, action, extra) {
  var params = {case: caseId, item: item, action: action};
  Object.keys(extra || {}).forEach(function (key) { params[key] = extra[key]; });
  call('/api/act', params);
}

function fillStartForm() {
  if ($('process').options.length) return;
  $('process').innerHTML = data.processes.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('');
  $('rule').innerHTML = data.rules.map(function (r) { return '<option' + (r === 'Least busy person' ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('');
  syncProcess();
}

function syncProcess() {
  var process = data.processes.filter(function (p) { return p.id === $('process').value; })[0];
  $('version').innerHTML = process.versions.map(function (v) { return '<option value="' + v + '">v' + v + '</option>'; }).join('');
  $('budgetBox').style.display = process.budget ? 'block' : 'none';
}

function renderSide() {
  $('cases').innerHTML = data.cases.length ? data.cases.map(function (c) {
    return '<button class="row' + (c.id === focus ? ' on' : '') + '" data-case="' + esc(c.id) + '"><span class="grow"><span class="name">' +
      (c.child ? '&#8627; ' : '') + esc(c.title) + '</span><br><span class="sub">' + esc(c.id) + ', ' + c.percent + '% done</span></span>' + pill(c.state) + '</button>';
  }).join('') : '<p class="empty">No cases yet.</p>';

  $('work').innerHTML = data.work.length ? data.work.map(function (w) {
    return '<button class="row" data-case="' + esc(w.case) + '" data-item="' + esc(w.item) + '"><span class="grow"><span class="name">' + esc(w.name) +
      '</span><br><span class="sub">' + esc(w.who || 'nobody yet') + ', needs ' + esc(w.role) + '<br>' + esc(w.case) + '</span></span>' + pill(w.state) + '</button>';
  }).join('') : '<p class="empty">Nothing is waiting.</p>';

  $('people').innerHTML = data.people.map(function (p) {
    return '<div class="row"><span class="grow"><span class="name">' + esc(p.name) + '</span> <span class="sub">' + esc(p.roles.join(', ')) + '</span></span><span class="sub">' + p.open + ' open</span></div>';
  }).join('');
}

function treeHtml(tree) {
  return tree.map(function (n, i) {
    var pad = 'padding-left:' + (8 + n.depth * 18) + 'px';
    if (n.kind === 'stage') return '<div class="node stage" style="' + pad + '">' + esc(n.name) + '</div>';
    if (n.kind === 'sub') return '<div class="node" style="' + pad + '"><span class="grow name">Sub-process: ' + esc(n.name) + '</span>' + pill(n.state) + '</div>';
    var chosen = picked && picked.case === n.case && picked.id === n.id;
    return '<button class="node' + (chosen ? ' on' : '') + (n.active ? ' current' : ' waiting') + '" style="' + pad + '" data-node="' + i + '">' +
      (n.active ? '<span class="dot" title="Routing is here"></span>' : '') + '<span class="grow"><span class="name">' + esc(n.name) + '</span> <span class="sub">' +
      esc(n.who || 'unassigned') + '</span></span>' + pill(n.state) + '</button>';
  }).join('');
}

function actionsHtml(node) {
  if (!node) return '<h2>Actions</h2><p class="empty">Select a work item in the tree. You can try anything: the item&#39;s state decides.</p>';
  var people = data.people.filter(function (p) { return p.roles.indexOf(node.role) >= 0; });
  var html = '<h2>' + esc(node.name) + ' ' + pill(node.state) + '</h2><p class="hint">Needs ' + esc(node.role) + ', held by ' + esc(node.who || 'nobody') +
    (node.active ? '. Routing is here.' : '. Routing has not reached this step.') + '</p><div class="actions">';
  html += '<div class="inline"><select id="who">' + people.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + ' (' + p.open + ' open)</option>'; }).join('') +
    '</select><button class="btn" data-action="assign">Assign</button></div>';
  [['available', 'Make available'], ['start', 'Start']].forEach(function (a) { html += '<button class="btn" data-action="' + a[0] + '">' + a[1] + '</button>'; });
  if (node.options.length) node.options.forEach(function (o) { html += '<button class="btn" data-action="complete" data-outcome="' + esc(o) + '">Complete: ' + esc(o) + '</button>'; });
  else html += '<button class="btn" data-action="complete">Complete</button>';
  [['reject', 'Reject'], ['escalate', 'Escalate'], ['fail', 'Fail'], ['cancel', 'Cancel']].forEach(function (a) { html += '<button class="btn warn" data-action="' + a[0] + '">' + a[1] + '</button>'; });
  if (node.deadline) html += '<button class="btn warn" id="deadline">Deadline missed</button>';
  return html + '</div>';
}

function edgesHtml(edges) {
  return edges.map(function (e) {
    return '<div class="edge' + (e.taken ? ' taken' : '') + '"><span>' + esc(e.from) + '</span><span>&rarr;</span><span>' + esc(e.to) + '</span>' +
      (e.label ? '<span class="lbl">' + esc(e.label) + '</span>' : '') + (e.taken ? '<span class="lbl">taken</span>' : '') + '</div>';
  }).join('');
}

function logHtml(s) {
  var plain = function (lines, mono) {
    return lines.length ? lines.slice().reverse().map(function (l) { return '<div class="line' + (mono ? ' mono' : '') + '">' + esc(l) + '</div>'; }).join('') : '<p class="empty">Nothing yet.</p>';
  };
  var views = {
    feed: function () { return s.feed.slice().reverse().map(function (f) {
      return '<div class="line ' + esc(f.kind) + '"><div class="text">' + esc(f.text) + '</div><div class="pat">' + esc(f.pattern) + '</div></div>'; }).join(''); },
    commands: function () { return plain(s.commands); },
    audit: function () { return plain(s.audit, true); },
    workload: function () { return plain(s.workload); }
  };
  return views[tab]();
}

function guardHtml() {
  var options = data.people.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('');
  return '<div class="card"><h2>Change the stage directly</h2><p class="hint">Goes through the Security, AllowedStates and Logging decorators. Try the student, or a state name that does not exist.</p>' +
    '<div class="actions"><div class="inline"><select id="guardWho">' + options + '</select><input id="guardState" value="RUNNING" aria-label="State"><button class="btn" id="guardGo">Try it</button></div></div></div>';
}

function renderDetail() {
  var s = data.selected;
  if (!s) {
    $('detail').innerHTML = '<div class="card" id="welcome"><h2>Start a case to begin</h2><p class="hint">Pick any process on the left. Each case gets its own tree, history and routing, and nothing here is scripted.</p></div>';
    return;
  }
  var node = null;
  s.tree.forEach(function (n) { if (picked && n.kind === 'item' && n.case === picked.case && n.id === picked.id) node = n; });
  var scroll = document.querySelector('.log');
  var top = scroll ? scroll.scrollTop : 0;
  var tabs = [['feed', 'What happened'], ['commands', 'Command history (' + s.commands.length + ')'], ['audit', 'Audit trail (' + s.audit.length + ')'], ['workload', 'Workload']];

  $('detail').innerHTML =
    '<div class="card"><div class="head"><h1>' + esc(s.title) + '</h1>' + pill(s.state) +
    '<button class="btn spacer" id="undo"' + (s.canUndo ? '' : ' disabled') + '>Undo last</button></div>' +
    '<p class="hint">' + esc(s.id) + (s.budget ? ', budget R' + esc(Number(s.budget).toLocaleString('en-ZA')) : '') +
    (s.parent ? ', sub-process of ' + esc(s.parent) : '') + ', ' + s.done + ' of ' + s.total + ' work items done</p>' +
    '<div class="bar"><i style="width:' + s.percent + '%"></i></div></div>' +
    '<div class="two"><div class="card"><h2>Live tree</h2>' + treeHtml(s.tree) + '</div>' +
    '<div class="stack"><div class="card">' + actionsHtml(node) + '</div><div class="card"><h2>Routing</h2>' + edgesHtml(s.edges) + '</div></div></div>' +
    '<div class="card"><div class="tabs">' + tabs.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
    '</div><div class="log">' + logHtml(s) + '</div></div>' + (s.guarded ? guardHtml() : '');

  var log = document.querySelector('.log');
  if (log) log.scrollTop = top;
}

function render() {
  if (!focus && data.cases.length) return open(data.cases[0].id);   // a refresh keeps showing the running cases
  fillStartForm();
  renderSide();
  renderDetail();
}

function open(caseId, itemId) {
  picked = itemId ? {case: caseId, id: itemId} : null;
  focus = caseId;
  call('/api/state', {case: caseId});
}

document.addEventListener('click', function (event) {
  var el = event.target.closest('button');
  if (!el) return;
  if (el.dataset.case) return open(el.dataset.case, el.dataset.item);
  if (el.dataset.node !== undefined) {
    var node = data.selected.tree[Number(el.dataset.node)];
    picked = {case: node.case, id: node.id};
    return render();
  }
  if (el.dataset.tab) { tab = el.dataset.tab; return renderDetail(); }
  if (el.dataset.action) {
    var extra = {};
    if (el.dataset.action === 'assign') extra.who = $('who').value;
    if (el.dataset.outcome) extra.outcome = el.dataset.outcome;
    return act(picked.case, picked.id, el.dataset.action, extra);
  }
  if (el.id === 'undo') return call('/api/undo', {case: focus});
  if (el.id === 'deadline') return call('/api/deadline', {case: picked.case});
  if (el.id === 'guardGo') return call('/api/guard', {case: focus, who: $('guardWho').value, state: $('guardState').value});
});

$('process').addEventListener('change', syncProcess);
$('start').addEventListener('click', function () {
  picked = null;
  call('/api/start', {process: $('process').value, version: $('version').value, budget: $('budget').value, rule: $('rule').value});
});
$('reset').addEventListener('click', function () {
  picked = null;
  focus = '';
  call('/api/reset');
});

call('/api/state');
</script>
</body>
</html>
